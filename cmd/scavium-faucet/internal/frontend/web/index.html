<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCAVIUM Faucet</title>
  <style>
    :root {
      --bg: #0b1220;
      --surface: #111a2b;
      --surface-2: #14203a;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --border: #253248;
      --primary: #f97316;
      --support: #2563eb;
      --ok: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
      --radius: 14px;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(circle at 20% 0%, #172747 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .layout {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 1.5rem;
      text-align: center;
    }

    h1 {
      margin: 0;
      color: var(--primary);
      letter-spacing: 0.02em;
      font-size: clamp(1.6rem, 2.5vw, 2rem);
    }

    .subtitle {
      margin-top: 0.4rem;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .card {
      background: linear-gradient(180deg, var(--surface) 0%, #0f1727 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      margin-bottom: 1rem;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.24);
    }

    .card h2 {
      margin: 0 0 0.9rem;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #cbd5e1;
    }

    .status {
      display: none;
      border-radius: 10px;
      border: 1px solid transparent;
      padding: 0.65rem 0.8rem;
      font-size: 0.9rem;
      margin-top: 0.8rem;
      line-height: 1.4;
    }

    .status.visible { display: block; }
    .status.info { background: rgba(37, 99, 235, 0.13); border-color: rgba(37, 99, 235, 0.35); }
    .status.success { background: rgba(34, 197, 94, 0.12); border-color: rgba(34, 197, 94, 0.35); }
    .status.warn { background: rgba(245, 158, 11, 0.13); border-color: rgba(245, 158, 11, 0.35); }
    .status.error { background: rgba(239, 68, 68, 0.12); border-color: rgba(239, 68, 68, 0.35); }

    .field {
      display: block;
      width: 100%;
      margin-bottom: 0.75rem;
    }

    label {
      display: block;
      color: var(--muted);
      font-size: 0.84rem;
      margin-bottom: 0.35rem;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.7rem 0.8rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 0.94rem;
    }

    input[type="text"]:focus {
      outline: 2px solid rgba(37, 99, 235, 0.4);
      border-color: var(--support);
    }

    .actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.2rem;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 0.75rem 0.9rem;
      font-weight: 700;
      font-size: 0.95rem;
      color: #fff;
      background: linear-gradient(135deg, var(--primary), #ea580c);
      cursor: pointer;
    }

    button.secondary {
      background: linear-gradient(135deg, var(--support), #1d4ed8);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .kv {
      display: grid;
      grid-template-columns: 130px 1fr;
      gap: 0.45rem;
      padding: 0.4rem 0;
      border-bottom: 1px solid rgba(148, 163, 184, 0.14);
      font-size: 0.88rem;
    }

    .kv:last-child { border-bottom: 0; }
    .kv .key { color: var(--muted); }
    .kv .val { word-break: break-all; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    .network-banner {
      display: none;
      margin-bottom: 0.9rem;
      border: 1px solid rgba(37, 99, 235, 0.35);
      background: rgba(37, 99, 235, 0.14);
      color: #dbeafe;
      border-radius: 10px;
      padding: 0.55rem 0.8rem;
      font-size: 0.84rem;
    }

    .network-banner.visible { display: block; }

    .hidden { display: none !important; }

    footer {
      text-align: center;
      color: #64748b;
      font-size: 0.78rem;
      margin-top: 1.4rem;
    }
  </style>
</head>
<body>
  <main class="layout">
    <header>
      <h1>SCAVIUM Faucet</h1>
      <p class="subtitle">Request testnet funds</p>
    </header>

    <div id="network-banner" class="network-banner"></div>
    <div id="pause-banner" class="status"></div>

    <section class="card">
      <h2>Request Funds</h2>
      <form id="claim-form" novalidate>
        <div class="field">
          <label for="address">Ethereum Address</label>
          <input type="text" id="address" placeholder="0x..." autocomplete="off" spellcheck="false" />
        </div>
        <div id="captcha-row" class="field hidden">
          <label for="captcha-token">Captcha Token</label>
          <input type="text" id="captcha-token" placeholder="Paste token here" autocomplete="off" />
        </div>
        <div class="actions">
          <button id="btn-send" type="submit">Send Funds</button>
          <button id="btn-refresh" class="secondary" type="button">Refresh Status</button>
        </div>
      </form>
      <div id="msg" class="status"></div>
    </section>

    <section id="claim-result" class="card hidden">
      <h2>Claim Status</h2>
      <div id="claim-kv"></div>
      <div id="explorer-link" class="status info hidden"></div>
    </section>

    <section id="config-card" class="card hidden">
      <h2>Network Info</h2>
      <div id="config-kv"></div>
    </section>

    <footer>Powered by SCAVIUM</footer>
  </main>

  <script src="/static/faucet.js" defer></script>
</body>
</html>
