openapi: 3.0.3
info:
  title: SCAVIUM Faucet API
  version: phase-30
  description: |
    Lightweight maintained contract for the implemented SCAVIUM Faucet HTTP API.
    This document mirrors real code and intentionally avoids generator dependencies.
servers:
  - url: /
paths:
  /health:
    get:
      summary: Health probe
      responses:
        '200': { description: OK }
  /ready:
    get:
      summary: Readiness probe
      responses:
        '200': { description: Ready }
        '503': { description: Not ready }
  /api/v1/status:
    get:
      summary: Faucet status
      responses:
        '200': { description: Current faucet status }
  /api/v1/faucet/status:
    $ref: '#/paths/~1api~1v1~1status'
  /api/v1/config:
    get:
      summary: Public faucet configuration
      responses:
        '200': { description: Claim-safe public configuration }
  /api/v1/faucet/config:
    $ref: '#/paths/~1api~1v1~1config'
  /api/v1/tokens:
    get:
      summary: Public token catalog
      responses:
        '200': { description: Claim-safe configured token list }
  /api/v1/faucet/tokens:
    $ref: '#/paths/~1api~1v1~1tokens'
  /api/v1/address/{address}/status:
    get:
      summary: Address eligibility status
      parameters:
        - $ref: '#/components/parameters/Address'
      responses:
        '200':
          description: Backward-compatible address status with optional Phase 25 fields
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressStatus' }
        '400': { $ref: '#/components/responses/InvalidAddress' }
  /api/v1/faucet/address/{address}/eligibility:
    $ref: '#/paths/~1api~1v1~1address~1{address}~1status'
  /api/v1/address/{address}/history:
    get:
      summary: Address claim history
      parameters:
        - $ref: '#/components/parameters/Address'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Paginated claim history in reverse creation order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressHistory' }
        '400': { description: Invalid address or pagination }
  /api/v1/faucet/address/{address}/history:
    $ref: '#/paths/~1api~1v1~1address~1{address}~1history'
  /api/v1/wallet/challenge:
    post:
      summary: Issue a short-lived wallet challenge
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WalletChallengeRequest' }
      responses:
        '201':
          description: Wallet challenge issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletChallenge' }
        '400': { description: Invalid JSON or address }
        '403': { description: Origin not allowed }
  /api/v1/faucet/wallet/challenge:
    $ref: '#/paths/~1api~1v1~1wallet~1challenge'
  /api/v1/claim:
    post:
      summary: Create a faucet claim
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimRequest' }
      responses:
        '202':
          description: Claim accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '400': { description: Invalid JSON or address }
        '403': { description: Claim rejected }
        '422': { description: Captcha failed }
        '429': { description: Rate limited or daily budget exceeded }
        '503': { description: Faucet unavailable }
  /api/v1/faucet/claim:
    $ref: '#/paths/~1api~1v1~1claim'
  /api/v1/claim/{id}:
    get:
      summary: Claim lookup
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Claim found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '404': { description: Claim not found }
  /api/v1/faucet/claim/{id}:
    $ref: '#/paths/~1api~1v1~1claim~1{id}'
  /api/v1/version:
    get:
      summary: Build metadata
      responses:
        '200': { description: Version metadata }
  /api/v1/admin/metrics:
    get:
      security: [ { bearerAuth: [] } ]
      summary: Admin runtime metrics
      responses:
        '200': { description: Admin-protected metrics snapshot }
        '401': { description: Missing or invalid bearer token }
        '503': { description: Admin API disabled }
  /api/v1/admin/metrics/prometheus:
    get:
      security: [ { bearerAuth: [] } ]
      summary: Admin Prometheus-compatible metrics
      responses:
        '200': { description: Admin-protected metrics text }
  /api/v1/admin/runtime:
    get:
      security: [ { bearerAuth: [] } ]
      summary: Admin runtime summary
      responses:
        '200': { description: Dashboard, readiness, metrics, and wallet summary }
  /api/v1/admin/policy:
    get:
      security: [ { bearerAuth: [] } ]
      summary: Admin runtime policy override view
      responses:
        '200':
          description: Runtime policy overrides
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuntimePolicy' }
    put:
      security: [ { bearerAuth: [] } ]
      summary: Replace admin runtime policy overrides
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuntimePolicy' }
      responses:
        '200': { description: Runtime policy updated }
        '400': { description: Invalid runtime policy }
    delete:
      security: [ { bearerAuth: [] } ]
      summary: Clear admin runtime policy overrides
      responses:
        '200': { description: Runtime policy cleared }
  /api/v1/admin/campaigns:
    get:
      security: [ { bearerAuth: [] } ]
      summary: List durable faucet campaigns
      responses:
        '200': { description: Campaign list }
    post:
      security: [ { bearerAuth: [] } ]
      summary: Create a durable faucet campaign
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignRequest' }
      responses:
        '201': { description: Campaign created }
        '400': { description: Invalid campaign }
  /api/v1/admin/campaigns/{id}:
    put:
      security: [ { bearerAuth: [] } ]
      summary: Update a durable faucet campaign
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignRequest' }
      responses:
        '200': { description: Campaign updated }
        '400': { description: Invalid campaign }
        '404': { description: Campaign not found }
  /api/v1/admin/campaigns/{id}/disable:
    post:
      security: [ { bearerAuth: [] } ]
      summary: Disable a durable faucet campaign
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Campaign disabled }
        '404': { description: Campaign not found }
  /api/v1/admin/campaigns/export.csv:
    get:
      security: [ { bearerAuth: [] } ]
      summary: Export a bounded campaign CSV
      responses:
        '200': { description: Campaign CSV }
  /api/v1/admin/invitations:
    post:
      security: [ { bearerAuth: [] } ]
      summary: Create an invitation code for a campaign
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationCodeRequest' }
      responses:
        '201': { description: Invitation code created }
        '400': { description: Invalid invitation }
  /api/v1/admin/allowlist:
    post:
      security: [ { bearerAuth: [] } ]
      summary: Add a campaign allowlist entry idempotently
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AllowlistAddRequest' }
      responses:
        '201': { description: Address allowlisted }
        '400': { description: Invalid allowlist entry }
  /api/v1/admin/wallet:
    get:
      security: [ { bearerAuth: [] } ]
      summary: Admin wallet visibility
      responses:
        '200': { description: Operator-safe wallet state }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Address:
      name: address
      in: path
      required: true
      schema:
        type: string
        pattern: '^0x[0-9a-fA-F]{40}$'
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 100
        default: 25
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
  responses:
    InvalidAddress:
      description: Invalid address envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    RuntimePolicy:
      type: object
      properties:
        cooldown_seconds: { type: integer, minimum: 0 }
        rate_limit_ip_per_hour: { type: integer, minimum: 0 }
        rate_limit_addr_per_day: { type: integer, minimum: 0 }
        daily_budget_wei: { type: string }
        token_daily_budget_wei:
          type: object
          additionalProperties: { type: string }
        source: { type: string }
    CampaignRequest:
      type: object
      required: [id, name, scope]
      properties:
        id: { type: string }
        name: { type: string }
        token_id: { type: string }
        scope: { type: string, enum: [public, invite, allowlist] }
        budget_wei: { type: string }
        enabled: { type: boolean }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
    InvitationCodeRequest:
      type: object
      required: [code, campaign_id]
      properties:
        code: { type: string }
        campaign_id: { type: string }
        max_uses: { type: integer, minimum: 0 }
        enabled: { type: boolean }
    AllowlistAddRequest:
      type: object
      required: [campaign_id, address]
      properties:
        campaign_id: { type: string }
        address: { type: string }
        note: { type: string }
    ErrorEnvelope:
      type: object
      required: [code, message, details, request_id]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: object, additionalProperties: true }
        request_id: { type: string }
    WalletChallengeRequest:
      type: object
      required: [address]
      properties:
        address: { type: string }
    WalletChallenge:
      type: object
      required: [id, address, nonce, message, expires_at, created_at]
      properties:
        id: { type: string }
        address: { type: string }
        nonce: { type: string }
        message: { type: string }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    ClaimRequest:
      type: object
      required: [address]
      properties:
        address: { type: string }
        token_id: { type: string }
        campaign_id: { type: string }
        invitation_code: { type: string }
        wallet_challenge_id: { type: string }
        wallet_signature: { type: string }
        captcha_token: { type: string }
        fingerprint: { type: string }
        website: { type: string, description: "Optional honeypot field; omit or leave empty." }
    Claim:
      type: object
      required: [id, address, amount_wei, status, created_at, updated_at]
      properties:
        id: { type: string }
        address: { type: string }
        tx_hash: { type: string }
        token_id: { type: string }
        token_symbol: { type: string }
        token_type: { type: string, enum: [native, erc20] }
        token_address: { type: string }
        token_decimals: { type: integer }
        amount_wei: { type: string }
        status:
          type: string
          enum: [received, validated, queued, sending, sent, confirmed, failed, rejected, paused]
        reason: { type: string }
        idempotency_key: { type: string }
        campaign_id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    BudgetStatus:
      type: object
      properties:
        budget_wei: { type: string }
        used_wei: { type: string }
        remaining_wei: { type: string }
    TokenStatus:
      type: object
      properties:
        token_id: { type: string }
        symbol: { type: string }
        type: { type: string }
        eligible: { type: boolean }
        reason: { type: string }
        amount_wei: { type: string }
        daily_budget: { $ref: '#/components/schemas/BudgetStatus' }
        cooldown_remaining_seconds: { type: integer }
        next_eligible_time: { type: string, format: date-time }
    AddressStatus:
      type: object
      required: [address, eligible, reason, cooldown_seconds, cooldown_remaining_seconds, rate_limit_ip_per_hour, rate_limit_addr_per_day]
      properties:
        address: { type: string }
        eligible: { type: boolean }
        reason: { type: string }
        cooldown_seconds: { type: integer }
        cooldown_remaining_seconds: { type: integer }
        next_eligible_time: { type: string, format: date-time }
        rate_limit_ip_per_hour: { type: integer }
        rate_limit_addr_per_day: { type: integer }
        default_token_id: { type: string }
        daily_budget: { $ref: '#/components/schemas/BudgetStatus' }
        tokens:
          type: array
          items: { $ref: '#/components/schemas/TokenStatus' }
    AddressHistory:
      type: object
      required: [address, claims, pagination]
      properties:
        address: { type: string }
        claims:
          type: array
          items: { $ref: '#/components/schemas/Claim' }
        pagination:
          type: object
          required: [limit, offset, count, has_more]
          properties:
            limit: { type: integer }
            offset: { type: integer }
            count: { type: integer }
            has_more: { type: boolean }
