<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCAVIUM Faucet</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }
    header { margin-bottom: 2rem; text-align: center; }
    header h1 { font-size: 1.8rem; color: #7cfc00; letter-spacing: 0.05em; }
    header p { font-size: 0.9rem; color: #888; margin-top: 0.4rem; }
    main { width: 100%; max-width: 520px; }
    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .card h2 { font-size: 1rem; color: #aaa; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.06em; }
    label { display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 0.3rem; }
    input[type="text"] {
      width: 100%;
      padding: 0.6rem 0.75rem;
      background: #111;
      border: 1px solid #333;
      border-radius: 4px;
      color: #e0e0e0;
      font-size: 0.95rem;
      margin-bottom: 0.75rem;
    }
    input[type="text"]:focus { outline: none; border-color: #7cfc00; }
    button {
      width: 100%;
      padding: 0.7rem;
      background: #7cfc00;
      color: #0f0f0f;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover:not(:disabled) { background: #6ae800; }
    button:disabled { background: #3a5a00; color: #666; cursor: not-allowed; }
    .status-line {
      font-size: 0.85rem;
      margin-top: 0.75rem;
      padding: 0.5rem 0.75rem;
      border-radius: 4px;
      display: none;
    }
    .status-line.visible { display: block; }
    .status-line.info    { background: #1a2a1a; border: 1px solid #2a5a2a; color: #90ee90; }
    .status-line.warn    { background: #2a2a1a; border: 1px solid #5a5a2a; color: #f0c040; }
    .status-line.error   { background: #2a1a1a; border: 1px solid #5a2a2a; color: #ff7070; }
    .kv { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 0.2rem 0; border-bottom: 1px solid #222; }
    .kv:last-child { border-bottom: none; }
    .kv .key { color: #888; }
    .kv .val { color: #e0e0e0; font-family: monospace; word-break: break-all; text-align: right; max-width: 65%; }
    a { color: #7cfc00; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .claim-result { display: none; }
    .claim-result.visible { display: block; }
    #network-banner {
      font-size: 0.8rem;
      text-align: center;
      padding: 0.3rem;
      background: #1a2a1a;
      border-radius: 4px;
      margin-bottom: 1rem;
      color: #7cfc00;
      display: none;
    }
    #network-banner.visible { display: block; }
    footer { margin-top: 2rem; font-size: 0.75rem; color: #555; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>SCAVIUM Faucet</h1>
    <p>Request testnet funds</p>
  </header>

  <main>
    <div id="network-banner"></div>

    <div id="pause-banner" class="status-line" style="margin-bottom:1rem;"></div>

    <div class="card">
      <h2>Request Funds</h2>
      <label for="address">Ethereum Address</label>
      <input type="text" id="address" placeholder="0x..." autocomplete="off" spellcheck="false" />
      <div id="captcha-row" style="display:none;">
        <label for="captcha-token">Captcha Token</label>
        <input type="text" id="captcha-token" placeholder="Paste token here" autocomplete="off" />
      </div>
      <button id="btn-send" onclick="submitClaim()">Send Funds</button>
      <div id="msg" class="status-line"></div>
    </div>

    <div id="claim-result" class="card claim-result">
      <h2>Claim Status</h2>
      <div id="claim-kv"></div>
      <div id="explorer-link" style="margin-top:0.75rem; font-size:0.85rem;"></div>
    </div>

    <div id="config-card" class="card" style="display:none;">
      <h2>Network Info</h2>
      <div id="config-kv"></div>
    </div>
  </main>

  <footer>Powered by SCAVIUM</footer>

  <script>
    var explorerTxURL = "";
    var currentClaimID = "";
    var pollTimer = null;
    var captchaProvider = "disabled";

    function show(el, cls) {
      el.className = "status-line visible " + (cls || "info");
    }

    function setMsg(text, cls) {
      var el = document.getElementById("msg");
      el.textContent = text;
      show(el, cls || "info");
    }

    function setPauseBanner(text, cls) {
      var el = document.getElementById("pause-banner");
      if (!text) { el.className = "status-line"; return; }
      el.textContent = text;
      show(el, cls || "warn");
    }

    function loadConfig() {
      fetch("/api/v1/config")
        .then(function(r) { return r.json(); })
        .then(function(data) {
          explorerTxURL = data.explorer_tx_url || "";
          captchaProvider = data.captcha_provider || "disabled";

          var banner = document.getElementById("network-banner");
          if (data.network_name) {
            banner.textContent = "Network: " + data.network_name + (data.symbol ? " · " + data.symbol : "");
            banner.className = "visible";
          }

          var card = document.getElementById("config-card");
          var kv = document.getElementById("config-kv");
          var rows = [];
          if (data.network_name)    rows.push(["Network",   data.network_name]);
          if (data.symbol)          rows.push(["Symbol",    data.symbol]);
          if (data.amount_eth)      rows.push(["Amount",    data.amount_eth + " " + (data.symbol || "")]);
          if (data.cooldown_seconds != null) rows.push(["Cooldown", data.cooldown_seconds + "s"]);
          if (data.dry_run != null) rows.push(["Dry Run",   data.dry_run ? "yes" : "no"]);
          kv.innerHTML = rows.map(function(r) {
            return '<div class="kv"><span class="key">' + r[0] + '</span><span class="val">' + esc(r[1]) + '</span></div>';
          }).join("");
          if (rows.length) card.style.display = "";

          if (captchaProvider && captchaProvider !== "disabled" && captchaProvider !== "") {
            document.getElementById("captcha-row").style.display = "";
          }
        })
        .catch(function() {});
    }

    function loadStatus() {
      fetch("/api/v1/status")
        .then(function(r) { return r.json(); })
        .then(function(data) {
          var mode = data.mode || "active";
          if (mode === "paused") {
            setPauseBanner("⚠ Faucet is currently paused. Please try again later.", "warn");
            document.getElementById("btn-send").disabled = true;
          } else if (mode === "maintenance") {
            setPauseBanner("🔧 Faucet is under maintenance.", "warn");
            document.getElementById("btn-send").disabled = true;
          } else if (mode === "no_funds") {
            setPauseBanner("⚠ Faucet has no funds at the moment.", "warn");
            document.getElementById("btn-send").disabled = true;
          } else {
            setPauseBanner("");
            document.getElementById("btn-send").disabled = false;
          }
        })
        .catch(function() {});
    }

    function submitClaim() {
      var addr = document.getElementById("address").value.trim();
      if (!addr) { setMsg("Please enter an address.", "error"); return; }
      if (!/^0x[0-9a-fA-F]{40}$/.test(addr)) {
        setMsg("Invalid Ethereum address.", "error"); return;
      }

      var btn = document.getElementById("btn-send");
      btn.disabled = true;
      setMsg("Submitting…", "info");

      var body = { address: addr };
      var captchaToken = document.getElementById("captcha-token").value.trim();
      if (captchaToken) body.captcha_token = captchaToken;

      fetch("/api/v1/claim", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      })
      .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, status: r.status, data: d }; }); })
      .then(function(res) {
        btn.disabled = false;
        if (!res.ok) {
          handleClaimError(res.status, res.data);
          return;
        }
        var claimID = res.data.id || res.data.claim_id || "";
        if (claimID) {
          setMsg("Claim submitted! Tracking…", "info");
          currentClaimID = claimID;
          startPolling(claimID);
        } else {
          setMsg("Claim submitted.", "info");
          showClaimData(res.data);
        }
      })
      .catch(function(err) {
        btn.disabled = false;
        setMsg("Network error. Please try again.", "error");
      });
    }

    function handleClaimError(status, data) {
      var code = (data && data.code) || "";
      var msg  = (data && data.message) || "Request failed.";
      if (code === "cooldown_active") {
        var secs = data && data.details && data.details.cooldown_remaining_seconds;
        setMsg("Cooldown active. Try again in " + (secs ? secs + "s" : "a while") + ".", "warn");
      } else if (code === "faucet_paused") {
        setMsg("Faucet is paused. Please try again later.", "warn");
      } else if (code === "faucet_maintenance") {
        setMsg("Faucet is under maintenance.", "warn");
      } else if (code === "rate_limited") {
        setMsg("Rate limited. Please try again later.", "warn");
      } else if (code === "blocked") {
        setMsg("Your address or IP is blocked.", "error");
      } else {
        setMsg(msg, "error");
      }
    }

    function startPolling(claimID) {
      clearInterval(pollTimer);
      pollOnce(claimID);
      pollTimer = setInterval(function() { pollOnce(claimID); }, 3000);
    }

    function pollOnce(claimID) {
      fetch("/api/v1/claim/" + encodeURIComponent(claimID))
        .then(function(r) { return r.json(); })
        .then(function(data) {
          showClaimData(data);
          var status = data.status || "";
          if (status === "confirmed" || status === "failed" || status === "rejected") {
            clearInterval(pollTimer);
          }
        })
        .catch(function() {});
    }

    function showClaimData(data) {
      var card = document.getElementById("claim-result");
      var kv   = document.getElementById("claim-kv");
      var rows = [];
      if (data.id)      rows.push(["Claim ID", data.id]);
      if (data.status)  rows.push(["Status",   data.status]);
      if (data.address) rows.push(["Address",  data.address]);
      if (data.amount_eth) rows.push(["Amount", data.amount_eth + (data.symbol ? " " + data.symbol : "")]);
      if (data.tx_hash) rows.push(["Tx Hash",  data.tx_hash]);
      if (data.created_at) rows.push(["Created", data.created_at]);
      if (data.updated_at) rows.push(["Updated", data.updated_at]);
      kv.innerHTML = rows.map(function(r) {
        return '<div class="kv"><span class="key">' + r[0] + '</span><span class="val">' + esc(r[1]) + '</span></div>';
      }).join("");
      card.className = "card claim-result visible";

      var txLink = document.getElementById("explorer-link");
      if (data.tx_hash && explorerTxURL) {
        var href = explorerTxURL.replace("{txHash}", encodeURIComponent(data.tx_hash));
        txLink.innerHTML = '<a href="' + esc(href) + '" target="_blank" rel="noopener">View on Explorer ↗</a>';
      } else {
        txLink.innerHTML = "";
      }
    }

    function esc(s) {
      return String(s)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;");
    }

    loadConfig();
    loadStatus();
  </script>
</body>
</html>
